<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1L Prep — Reading &amp; Casebook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --c:#5b3d8f;            /* current course accent (switches per course) */
  --c-soft:#efe9f8;
  --c-deep:#3c2762;
  --ink:#20242b;
  --ink2:#6a7280;
  --line:#e3e6ec;
  --paper:#ffffff;
  --bg:#f3f4f8;
  --pin-y:#fff3a6;--pin-g:#d3f2d9;--pin-p:#ffd9e2;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,sans-serif;
  font-size:15px;line-height:1.75;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ============ shell ============ */
.app{display:flex;min-height:100vh;}
.rail{
  width:270px;flex:0 0 270px;background:#fff;border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  transition:margin-left 0.3s ease; /* 사이드바 애니메이션 추가 */
}
.rail-head{
  padding:18px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;
}
.rail-head .app-name{font-size:18px;font-weight:800;letter-spacing:-.02em;outline:none;border-radius:6px;}
.rail-head .app-sub{font-size:11.5px;color:var(--ink2);margin-top:2px;}

/* 사이드바 토글 버튼 CSS 추가 */
.rail-close{border:0;background:none;padding:6px;border-radius:6px;color:var(--ink2);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.rail-close:hover{background:var(--bg);color:var(--ink);}
.rail.closed{margin-left:-270px;}
.rail-open{
  position:fixed;top:16px;left:16px;z-index:90;width:38px;height:38px;border-radius:9px;
  background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(20,24,40,0.1);
  font-size:18px;color:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center;
}
.rail-open:hover{color:var(--c);border-color:var(--c);}
.rail.closed ~ .rail-open{display:flex;}

.rail-search{padding:10px 14px;border-bottom:1px solid var(--line);}
.rail-search input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;background:var(--bg);}
.rail-search input:focus{border-color:var(--c);background:#fff;}
.rail-list{flex:1;overflow-y:auto;padding:10px 10px 30px;}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;
  padding:9px 11px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);
}
.nav-btn:hover{background:var(--bg);}
.nav-btn.on{background:var(--c-soft);color:var(--c-deep);}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px;}
.nav-count{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:600;}
.rail-sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:16px 11px 5px;}
.rail-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11.5px;font-weight:600;padding:6px 10px;color:var(--ink2);}
.mini:hover{color:var(--c);border-color:var(--c);}

.main{flex:1;min-width:0;padding:0 0 90px;}
.course-band{height:5px;background:var(--c);}
.wrap{max-width:1100px;margin:0 auto;padding:24px clamp(18px,3vw,36px);}
.main{overflow-x:clip;}
/* 사이드바 닫힘 → 더 크게 보이고 중앙 배치 */
.rail.closed ~ .main .wrap{max-width:1300px;padding-left:clamp(18px,3vw,36px);padding-right:clamp(18px,3vw,36px);}
@media (max-width:1240px){.rail.closed ~ .main .wrap{padding-left:66px;padding-right:66px;}}
@media (max-width:760px){.rail.closed ~ .main .wrap{padding-left:66px;padding-right:18px;}}
/* 사이드바 열린 상태에서 화면이 좁으면 세션 목록을 좁히거나 위로 */
@media (max-width:1260px){.read-grid{grid-template-columns:225px 1fr;gap:14px;}}
@media (max-width:1080px){.read-grid{grid-template-columns:1fr;}.sess-col{position:relative;max-height:260px;}}

/* ============ home ============ */
.home-hero{margin:6px 0 22px;}
.home-hero h1{font-size:26px;}
.home-hero p{margin:6px 0 0;color:var(--ink2);font-size:13.5px;}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.book{
  background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;min-height:150px;box-shadow:0 1px 2px rgba(20,24,40,.04);
}
.book .spine{
  width:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:center;
  padding:12px 0;position:relative;
}
.book .spine span{
  writing-mode:vertical-rl;color:#fff;font-family:var(--serif);font-weight:600;
  font-size:12.5px;letter-spacing:.18em;opacity:.95;
}
.book .ribbon{
  position:absolute;top:0;right:7px;width:9px;background:rgba(255,255,255,.85);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 5px),0 100%);
}
.book .body{padding:15px 17px;flex:1;display:flex;flex-direction:column;gap:6px;}
.book h3{font-size:16.5px;}
.book .meta{font-size:12px;color:var(--ink2);}
.book .next{font-size:12.5px;background:var(--bg);border-radius:8px;padding:7px 10px;margin-top:auto;}
.book .next b{font-weight:700;}
.book .go{align-self:flex-start;margin-top:9px;border:0;border-radius:8px;color:#fff;font-size:12.5px;font-weight:700;padding:7px 13px;}

/* ============ course head + tabs ============ */
.course-top{display:flex;align-items:center;gap:14px;margin:4px 0 16px;flex-wrap:wrap;}
.course-top h1{font-size:23px;}
.course-top .pill{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--c);padding:3px 11px;border-radius:99px;}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;margin-bottom:18px;}
.tab{border:0;background:none;font-size:13.5px;font-weight:700;color:var(--ink2);padding:7px 16px;border-radius:8px;}
.tab.on{background:var(--c);color:#fff;}
.tab .b{font-size:10.5px;opacity:.8;margin-left:5px;}
.right-tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;color:var(--ink);}
.btn:hover{border-color:var(--c);color:var(--c);}
.btn.pri{background:var(--c);border-color:var(--c);color:#fff;}
.btn.pri:hover{background:var(--c-deep);color:#fff;}
.btn.danger{color:#a33;}
.btn.danger:hover{border-color:#a33;}

/* ============ reading tab ============ */
.read-grid{display:grid;grid-template-columns:265px 1fr;gap:18px;align-items:start;}
.sess-col{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;position:sticky;top:14px;max-height:calc(100vh - 30px);display:flex;flex-direction:column;}
.sess-col-head{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.sess-col-head h4{font-size:12.5px;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;}
.sess-col-head .mini{margin-left:auto;}
.sess-scroll{overflow-y:auto;padding:6px;}
.unitlab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:11px 9px 4px;}
.sess-item{
  display:block;width:100%;text-align:left;border:0;background:none;border-left:3px solid transparent;
  padding:7px 9px;border-radius:8px;font-size:12.8px;line-height:1.45;color:var(--ink);
}
.sess-item:hover{background:var(--bg);}
.sess-item.on{background:var(--c-soft);border-left-color:var(--c);font-weight:600;}
.sess-item .n{font-size:10.5px;color:var(--ink2);font-weight:700;margin-right:5px;}
.sess-item.done .n::after{content:" ✓";color:var(--c);}
.sess-item[draggable]{cursor:grab;}
.sess-item.dragging{opacity:.4;}
.sess-item .pg{display:block;font-size:11px;color:var(--ink2);}

.sess-head{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:13px;padding:18px 22px;margin-bottom:15px;}
.sess-head .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);font-weight:700;}
.sess-head h2{font-size:21px;margin-top:4px;}
.pages{display:inline-block;margin-top:8px;background:var(--c-soft);color:var(--c-deep);font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:99px;}
.head-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:12.5px;color:var(--ink2);}
.head-row input[type=date]{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
.head-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.linkish{border:0;background:none;color:var(--ink2);font-size:12px;text-decoration:underline;padding:0;}
.linkish:hover{color:#a33;}

.card{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden;}
.card-head{display:flex;align-items:center;gap:9px;padding:10px 17px;background:var(--c-soft);border-bottom:1px solid var(--line);}
.card-head h3{font-size:13.5px;color:var(--c-deep);}
.card-head .hint{font-size:11px;color:var(--ink2);margin-left:auto;font-weight:400;}
.card-body{padding:15px 17px;}
.card.rule .card-head{background:#fdf6e3;}
.card.rule .card-head h3{color:#7a5410;}
.card.cold .card-head{background:#eef1fb;}
.card.cold .card-head h3{color:#33417d;}
.card.out .card-head{background:#f6efe7;}
.card.out .card-head h3{color:#6d4a1f;}

[contenteditable]{outline:none;min-height:26px;border-radius:8px;padding:6px 12px;}
[contenteditable]:focus{background:#fafbff;box-shadow:inset 0 0 0 1px var(--line);}
.vtable [contenteditable],table.nt [contenteditable],.arg-item [contenteditable],h2.blk-title,h3.blk-title,.bp-name,.bp-cite,#eTitle,#ePages,.qa-q,.qa-a{padding:2px 6px;}
[contenteditable] blockquote,[contenteditable] .callout,[contenteditable] ul,[contenteditable] ol{margin-left:4px;}
[contenteditable]:empty:before{content:attr(data-ph);color:#adb4c2;font-style:italic;}
mark{padding:1px 2px;border-radius:3px;}

.qa{border-left:3px solid #4d5fa8;padding-left:12px;margin-bottom:13px;}
.qa .q{font-weight:700;color:#33417d;font-size:13.5px;}
.qa .a{margin-top:3px;}
.rm{border:0;background:none;color:#b06b6b;font-size:11px;padding:0;margin-top:4px;}

.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:99px;font-size:12.5px;font-weight:600;padding:5px 12px;color:var(--ink);
}
.chip:hover{border-color:var(--c);color:var(--c);}
.chip .x{color:var(--ink2);font-weight:400;}
.chip.add{background:#fff;border-style:dashed;color:var(--ink2);}

/* toolbar */
.fmtbar{
  position:sticky;top:0;z-index:25;background:rgba(255,255,255,.97);backdrop-filter:blur(5px);
  border:1px solid var(--line);border-radius:11px;padding:6px 10px;margin-bottom:13px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.tool{border:1px solid var(--line);background:#fff;width:29px;height:27px;border-radius:6px;font-size:12.5px;font-weight:700;padding:0;}
.tb{border:0;background:none;height:30px;min-width:30px;padding:0 5px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:var(--ink);cursor:pointer;font-size:13px;font-weight:700;}
.tb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.tb:hover{background:var(--bg);color:var(--c);}
.tb.on{background:var(--c-soft);color:var(--c-deep);}
.tb.drop{padding:0 4px 0 6px;}
.tb .ic{display:inline-flex;flex-direction:column;align-items:center;}
.tb .bar{width:18px;height:4px;border-radius:2px;margin:1px 0 0;display:block;cursor:pointer;}
.tb .ic+.bar{margin-left:-22px;margin-top:20px;}
.tsep{width:1px;height:20px;background:var(--line);margin:0 3px;}
.sizebox{display:inline-flex;align-items:center;gap:1px;}
.sizebox .tb{min-width:22px;height:26px;font-size:15px;font-weight:400;}
.sw{width:21px;height:21px;border-radius:5px;border:1px solid rgba(0,0,0,.14);cursor:pointer;}
.tlabel{font-size:10.5px;color:var(--ink2);margin:0 3px 0 7px;letter-spacing:.05em;}
.pop-t{font-size:11.5px;font-weight:800;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;white-space:nowrap;}
.pop-t .hint{white-space:normal;}
.pop-t .hint{font-weight:400;}
.sw-grid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.swb{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.1);cursor:pointer;}
.swb:hover{transform:scale(1.12);border-color:var(--c);}
.sw-grid input[type=color]{width:28px;height:28px;border:1px dashed var(--line);border-radius:8px;padding:1px;background:#fff;cursor:pointer;}
.sym-g{margin-bottom:8px;}
.sym-gl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px;}
.hr-opts{display:flex;flex-direction:column;gap:4px;width:260px;}
.hr-opts button{border:1px solid transparent;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;}
.hr-opts button:hover{border-color:var(--c);background:var(--bg);}
.hr-opts hr{margin:6px 0;}
/* 구분선 스타일 (모든 에디터 공통) */
[contenteditable] hr,.hr-opts hr,.p-brief hr,#printRoot hr{border:0;height:0;margin:16px 0;}
hr.hr-thin{border-top:1px solid var(--line-strong,#c9ced8);}
hr.hr-dash{border-top:1.5px dashed #c9ced8;}
hr.hr-bold{border-top:3px solid var(--ink);opacity:.85;}
hr.hr-deco{position:relative;height:14px;background:linear-gradient(90deg,transparent 0,#c9ced8 20%,#c9ced8 80%,transparent);background-size:100% 1px;background-repeat:no-repeat;background-position:center;}
hr.hr-deco::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:0 8px;font-size:11px;color:var(--c);}
[contenteditable] hr:not([class]){border-top:1px solid #c9ced8;}
/* 블록 서식 (모든 에디터 공통) */
[contenteditable] h1{font-size:21px;margin:14px 0 6px;letter-spacing:-.01em;font-weight:800;}
[contenteditable] h2{display:block;background:#f5edda;border-radius:9px;padding:6px 13px;font-size:14.5px;margin:12px 0 6px;font-weight:700;}
[contenteditable] blockquote[style]{border:0;background:none;padding:0;margin:2px 0 2px 28px !important;}
[contenteditable] blockquote:not([style]){border-left:3px solid var(--c);margin:10px 0;padding:6px 14px;background:var(--c-soft);border-radius:0 9px 9px 0;color:var(--ink);}
[contenteditable] ul,[contenteditable] ol{padding-left:22px;margin:4px 0;}
/* ============ cases tab ============ */
.case-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.ai-box{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 17px;margin-bottom:16px;}
.ai-box h3{font-size:13.5px;display:flex;align-items:center;gap:7px;}
.ai-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.ai-row input{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none;}
.ai-row input:focus{border-color:var(--c);}
.ai-row select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;}
.ai-note{font-size:11.5px;color:var(--ink2);margin-top:8px;}
.case-list{display:flex;flex-direction:column;gap:10px;}
.case-row{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;
}
.case-row:hover{border-color:var(--c);}
.case-row .cname{font-family:var(--serif);font-weight:600;font-size:16px;flex:1;min-width:0;cursor:pointer;}
.case-row .ccite{font-size:12px;color:var(--ink2);display:block;font-family:"Pretendard",sans-serif;}
.case-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--c);}
.grip{cursor:grab;color:#c3c8d4;font-size:15px;user-select:none;}
.case-row.dragging{opacity:.4;}
.bulkbar{
  position:sticky;bottom:14px;z-index:20;background:var(--ink);color:#fff;border-radius:12px;
  padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 8px 22px rgba(20,24,40,.25);
}
.bulkbar select{border-radius:7px;border:0;padding:6px 8px;font-size:12.5px;}
.bulkbar .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;}
.bulkbar .btn:hover{background:rgba(255,255,255,.25);color:#fff;}

/* brief editor */
.brief-page{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;}
.brief-page .bp-top{display:flex;gap:10px;align-items:flex-start;}
.brief-page .bp-name{font-family:var(--serif);font-size:24px;font-weight:700;flex:1;}
.bp-cite{font-size:13px;color:var(--ink2);margin-top:3px;}
.irac{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;margin-top:20px;align-items:start;}
.ik{
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#fff;
  padding:4px 0;border-radius:6px;text-align:center;margin-top:3px;
}
.ik.f{background:#5f6b7a;}.ik.i{background:var(--c);}.ik.r{background:#c98b1e;}
.ik.a{background:#4d5fa8;}.ik.c{background:#8c5fa8;}
.memos{margin-top:24px;}
.memos h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px;}
.postit{border-radius:4px 4px 14px 4px;padding:12px 13px 14px;font-size:13px;box-shadow:0 3px 8px rgba(20,24,40,.12);position:relative;}
.postit:nth-child(odd){transform:rotate(-.7deg);}
.postit:nth-child(even){transform:rotate(.6deg);}
.postit .ptype{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.55;}
.postit [contenteditable]{margin-top:4px;min-height:40px;background:transparent;}
.postit .rm{position:absolute;top:7px;right:9px;}
.memo-add{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}

/* ============ outline tab ============ */
.outline-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 38px;}
.outline-doc h2{font-size:21px;border-bottom:2.5px solid var(--c);padding-bottom:8px;}
.outline-doc .osub{font-size:12px;color:var(--ink2);margin-top:7px;}
.out-unit{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--c);font-weight:800;margin:24px 0 7px;}
.out-item{margin-bottom:13px;padding-left:13px;border-left:2px solid var(--line);}
.out-item h4{font-size:13.5px;}
.out-item .pg{font-size:11px;color:var(--ink2);font-weight:600;}
.out-rule{margin-top:4px;font-size:13.5px;}
.out-line{margin-top:4px;font-size:13.5px;color:#6d4a1f;}
.out-cases{margin-top:4px;font-size:12px;color:var(--ink2);font-style:italic;}
.empty{color:#adb4c2;font-style:italic;font-size:13.5px;}

/* search results */
.sr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:16px;}
.sr button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:13.5px;}
.sr button:hover{background:var(--bg);}
.sr .where{font-size:11px;color:var(--ink2);}

/* modal */
.veil{position:fixed;inset:0;background:rgba(24,26,34,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:15px;max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow-y:auto;}
.modal h3{font-size:16px;}
.modal p{font-size:13px;color:var(--ink2);}
.modal label{display:block;font-size:12.5px;font-weight:700;margin:13px 0 4px;}
.modal input[type=text],.modal input[type=url],.modal select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.pick-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;margin-top:8px;}
.pick-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line);}
.pick-list button:last-child{border-bottom:0;}
.pick-list button:hover{background:var(--bg);}
.colors{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.colors .sw{width:26px;height:26px;border-radius:8px;}
.colors .sw.on{outline:3px solid var(--ink);outline-offset:2px;}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;font-size:12.5px;
  padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ============ class notes ============ */
.note-doc{min-height:430px;padding:18px 26px;font-size:15px;line-height:1.85;}
.note-doc h1{font-size:23px;margin:16px 0 6px;letter-spacing:-.01em;}
.note-doc h2{display:block;background:#f5edda;border-radius:9px;padding:7px 14px;font-size:15.5px;margin:13px 0 7px;font-weight:700;}
.note-doc hr{border:0;border-top:2px solid var(--line);margin:15px 0;}
.note-doc img{max-width:100%;border-radius:9px;display:block;margin:8px 0;}
.callout{border-radius:12px;padding:12px 16px;margin:11px 0;line-height:1.8;}
.callout-t{text-decoration:underline;letter-spacing:.12em;text-transform:uppercase;font-weight:800;font-size:11.5px;margin-bottom:4px;}
.pdfblock{border:1.5px solid var(--line);border-radius:11px;margin:12px 0;overflow:hidden;background:#fafbfd;}
.pdfhead{display:flex;gap:7px;align-items:center;padding:8px 12px;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--line);}
.pdfname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdfframe{width:100%;height:480px;border:0;display:block;background:#eceef2;}
.pdfblock.folded .pdfframe{display:none;}
.att-missing{outline:2px dashed #c66;}
.attrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;margin-top:8px;background:#fff;}
.attview iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:9px;margin-top:6px;}
.fmtbar select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;background:#fff;max-width:110px;}
.fmtbar .numin{width:46px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;font-size:12px;text-align:center;}
.pop{position:absolute;z-index:70;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 28px rgba(20,24,40,.18);padding:10px;max-width:330px;}
.sym-wrap{display:flex;flex-wrap:wrap;gap:4px;}
.sym-wrap button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:30px;height:30px;font-size:13.5px;padding:0 6px;}
.sym-wrap button:hover{border-color:var(--c);}
.pop .pclose{display:block;margin:8px 0 0 auto;}
.note-title{font-size:21px;font-weight:800;outline:none;border-radius:6px;}
.note-meta{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink2);}
.note-meta input[type=date]{padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
.note-page{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 24px;}


/* ============ 과목별 브리프 블록 ============ */
.bk-list{display:flex;flex-direction:column;gap:14px;margin-top:20px;}
.bk{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.bk-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--line);}
.bk-head h3{font-size:13.5px;}
.bk-head .hint{font-size:11px;color:var(--ink2);margin-left:auto;font-weight:400;text-align:right;max-width:58%;line-height:1.4;}
.bk-head .blk-tools{margin-left:8px;flex:0 0 auto;}
.bk-head .hint+.blk-tools{margin-left:8px;}
.bk-head h3+.blk-tools{margin-left:auto;}
.bk-tag{font-size:10.5px;font-weight:800;color:#fff;letter-spacing:.06em;min-width:30px;padding:3px 7px;border-radius:6px;text-align:center;}
.bk-body{padding:13px 16px;}
.bk-ed{min-height:44px;padding:10px 14px;}
.bk-ko{margin-top:6px;font-size:12.5px;line-height:1.7;color:#4a5060;background:#f7f8fb;border-radius:7px;padding:6px 10px;min-height:30px;}
.bk-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.bk-sub{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px;}
.party{border-radius:10px;padding:10px 12px;}
.party.p{background:#eef5f3;}.party.d{background:#fbeef1;}
.party .bk-sub{color:inherit;opacity:.7;}
.tpl-pick{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;}
.tpl-pick select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;background:#fff;max-width:200px;}
/* 단어장 */
.vtable{width:100%;border-collapse:collapse;font-size:13.5px;}
.vtable th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:4px 8px;border-bottom:2px solid var(--line);}
.vtable td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.vtable td:first-child{font-weight:700;font-family:var(--serif);}
.vtable td:nth-child(3){color:#3c2762;}
.vc-tools{white-space:nowrap;}
.vc-tools .mini{padding:3px 6px;margin-left:2px;}
/* 원문+번역 */
.op-paste{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.7;resize:vertical;}
.op-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.op-list{display:flex;flex-direction:column;gap:12px;}
.op-para{display:grid;grid-template-columns:36px 1fr auto;gap:4px 10px;align-items:start;border-left:3px solid var(--line);padding-left:6px;}
.op-para:hover{border-left-color:var(--c);}
.op-n{font-size:10.5px;color:var(--ink2);font-weight:700;padding-top:4px;grid-row:1/3;}
.op-en{font-family:var(--serif);font-size:15px;line-height:1.75;grid-column:2;}
.op-ko{grid-column:2;font-size:12.5px;line-height:1.7;color:#4a5060;background:#f7f8fb;border-radius:7px;padding:5px 9px;}
.op-list.hide-ko .op-ko{display:none;}
.op-btns{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;gap:4px;}
/* 주장 */
.arg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.arg-col{border-radius:10px;padding:10px 12px;}
.arg-col.p{background:#eef5f3;}.arg-col.d{background:#fbeef1;}
.arg-col .bk-sub{color:inherit;opacity:.75;}
.arg-item{display:flex;gap:8px;align-items:flex-start;margin:6px 0;}
.arg-item .arg-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;margin-top:10px;flex:0 0 6px;}
.arg-item [contenteditable]{flex:1;font-size:13.5px;}
.arg-item .rm{margin-top:4px;}
/* Torts 파트 전환 */
.parts{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;width:max-content;}
.part{border:0;background:none;font-size:13.5px;font-weight:700;color:var(--ink2);padding:9px 20px;}
.part.on{background:var(--c);color:#fff;}
/* 연결 판례 카드 */
.kcard{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:10px;background:#fff;}
.kcard-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kcard .kname{font-family:var(--serif);font-weight:700;font-size:16px;cursor:pointer;}
.kcard .kname:hover{color:var(--c);}
.kcard .ccite{font-size:12px;color:var(--ink2);flex:1;}
.kcard .kf{margin-top:8px;font-size:13.5px;line-height:1.7;}
.kcard .kf b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px;}
/* 사전 */
.dict-bubble{position:absolute;z-index:95;display:none;border:0;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;box-shadow:0 4px 12px rgba(20,24,40,.25);}
.dict-panel{position:fixed;right:22px;bottom:22px;width:360px;max-width:calc(100vw - 32px);max-height:70vh;overflow-y:auto;z-index:96;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,24,40,.22);padding:14px 16px;display:none;}
.dict-panel.show{display:block;}
.dict-head{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;}
.dict-pos{font-family:"Pretendard",sans-serif;font-size:11px;color:var(--ink2);font-style:italic;}
.dict-row{display:flex;gap:6px;margin-top:10px;}
.dict-row input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;}
.dict-row input:focus{border-color:var(--c);}
.dict-hint{font-size:12px;color:var(--ink2);margin-top:8px;}
.dict-ko{font-size:16px;font-weight:700;color:#3c2762;margin-top:10px;}
.dict-en{font-size:13.5px;margin-top:4px;line-height:1.6;}
.dict-legal{font-size:12.5px;margin-top:8px;background:var(--bg);border-radius:8px;padding:7px 10px;line-height:1.6;}
.dict-legal b{color:var(--c);margin-right:4px;}
.dict-ex{font-size:12.5px;color:var(--ink2);font-style:italic;margin-top:6px;font-family:var(--serif);}
.dict-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}
.dict-links a{font-size:11.5px;color:var(--ink2);text-decoration:none;}
.dict-links a:hover{color:var(--c);}
.memo-add .hint{font-size:11px;color:var(--ink2);align-self:center;}
.hint{font-size:11px;color:var(--ink2);}
@media (max-width:900px){.bk-pair,.arg-grid{grid-template-columns:1fr;}.bk-head .hint{display:none;}}


/* 리딩노트 블록 */
.blk .card-head h3.blk-title{outline:none;min-width:60px;}
.blk .card-head h3.blk-title:focus{border-bottom:1px dashed var(--c);}
.blk-icon{font-size:14px;}
.blk-tools{display:flex;gap:3px;margin-left:8px;}
.blk-tools .mini{padding:2px 6px;opacity:.6;}
.blk:hover .blk-tools .mini{opacity:1;}
.addblock{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);margin:4px 0 18px;}
.concept{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);}
.concept:last-of-type{border-bottom:0;}
.c-name{font-weight:800;color:var(--c-deep);font-size:14px;}
.c-body{font-size:13.5px;line-height:1.7;}
.concept .rm{margin-top:2px;}
.reader .op-en{font-size:16px;line-height:1.85;}
.reader .op-ko{font-size:12.5px;color:#6b7280;background:none;padding:0 2px;}
@media (max-width:900px){.concept{grid-template-columns:1fr;}}


/* 표 */
[contenteditable] table.nt,#printRoot table.nt{border-collapse:collapse;width:100%;table-layout:fixed;margin:10px 0;font-size:13.5px;}
table.nt td,table.nt th{border:1px solid #cfd4dd;padding:6px 9px;vertical-align:top;min-width:40px;word-break:break-word;}
table.nt th{background:#f1f3f7;font-weight:700;text-align:left;}
table.nt td:empty::after,table.nt th:empty::after{content:"\00a0";}
table.nt td:hover,table.nt th:hover{outline:1px solid var(--c);outline-offset:-1px;}
table.nt.bold td,table.nt.bold th{border-color:#20242b;}
table.nt.nb td,table.nt.nb th{border-color:transparent;}
table.nt.zebra tr:nth-child(even) td{background:#f7f8fb;}
.tbl-pick{display:grid;grid-template-columns:repeat(8,16px);gap:3px;}
.tbl-pick span{width:16px;height:16px;border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;}
.tbl-pick span.on{background:var(--c-soft);border-color:var(--c);}
.tbl-tools{position:fixed;z-index:94;display:none;gap:3px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 6px;box-shadow:0 6px 18px rgba(20,24,40,.14);font-size:12px;}
.tbl-tools.show{display:flex;}
.tbl-tools button{border:0;background:none;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);}
.tbl-tools button:hover{background:var(--bg);color:var(--c);}
@media print{.tbl-tools{display:none !important;}}


.tl-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:start;padding:6px 0;border-left:2px solid var(--line);margin-left:6px;padding-left:12px;position:relative;}
.tl-row::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c);}
.tl-when{font-weight:800;font-size:13px;color:var(--c-deep);}
.tl-what{font-size:13.5px;line-height:1.7;}

#printRoot{display:none;}
@media print{
  @page{margin:12mm 10mm;size:A4;}
  body{background:#fff;font-size:10.5pt;line-height:1.5;}
  .app,.toast,.veil,.rail-open{display:none !important;}
  #printRoot{display:block;width:100%;}
  #printRoot .p-brief{padding:0 !important;margin:0 0 20px !important;}
  #printRoot .p-brief>table{width:100% !important;table-layout:fixed !important;font-size:10pt;}
  #printRoot .p-brief>table>tbody>tr>td{padding:7px 8px !important;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;white-space:normal;}
  #printRoot .p-brief>table>tbody>tr>td:first-child{width:118px !important;padding-left:6px !important;white-space:nowrap;overflow:hidden;}
  #printRoot .p-brief>table>tbody>tr>td:first-child span:last-child{white-space:normal;display:block;margin-top:3px;font-size:10pt;line-height:1.3;}
  #printRoot table table{width:100% !important;table-layout:fixed !important;}
  #printRoot td *,#printRoot .note-doc *{max-width:100% !important;white-space:normal !important;overflow-wrap:anywhere;}
  #printRoot pre,#printRoot code{white-space:pre-wrap !important;}
  #printRoot img{max-width:100% !important;height:auto !important;}
  #printRoot [style*="width"]{max-width:100% !important;}
  /* 화면 그대로 인쇄 */
  .p-live .brief-page,.p-live .card,.p-live .sess-head{border:0 !important;border-radius:0 !important;padding:0 !important;box-shadow:none !important;background:#fff !important;}
  .p-live .bk,.p-live .blk{page-break-inside:auto;break-inside:auto;margin-bottom:12px;border-radius:8px;}
  .p-live .bk-head,.p-live .blk-head,.p-live h2,.p-live h3{page-break-after:avoid;break-after:avoid;}
  .p-live .bk-head .hint,.p-live .blk-head .hint,.p-live .blk-hint{display:none !important;}
  .p-live .p-empty{display:none !important;}
  .p-live .bk-ed,.p-live .blk-ed,.p-live .c-body,.p-live .tl-what{page-break-inside:auto;}
  .p-live *{-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:normal !important;overflow-wrap:anywhere;}
  .p-live pre,.p-live code{white-space:pre-wrap !important;}
  .p-live .tl-when,.p-live .bk-head h3,.p-live .blk-title{white-space:normal !important;}
  .p-live [class]{max-width:100%;}
  .p-live .bk-pair{grid-template-columns:1fr 1fr;}
  .p-live .memos:empty,.p-live .memo-grid:empty{display:none;}
  #printRoot .p-brief{page-break-after:always;}
  #printRoot .p-brief:last-child{page-break-after:auto;}
  mark,.ik,.pages,.out-unit{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #printRoot .pdfframe{display:none !important;}
  .dict-panel,.dict-bubble{display:none !important;}
  #printRoot .pdfhead button{display:none !important;}
  #printRoot .note-doc h2,#printRoot .callout,#printRoot mark{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media (max-width:900px){
  .app{flex-direction:column;}
  .rail{width:100%;height:auto;position:relative;flex:none;}
  .rail.closed{margin-left:0;}
  .rail-close, .rail-open{display:none !important;}
  .rail-list{max-height:250px;}
  .read-grid{grid-template-columns:1fr;}
  .sess-col{position:relative;max-height:290px;}
  .wrap{padding:18px 16px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div style="min-width:0;">
        <div class="app-name" id="appName" contenteditable spellcheck="false">1L Prep</div>
        <div class="app-sub">Reading Notes · Casebook · Exam Outline</div>
      </div>
      <button class="rail-close" onclick="toggleRail()" title="사이드바 닫기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    <div class="rail-search"><input id="gsearch" placeholder="전체 검색 — 세션·판례·내용"></div>
    <div class="rail-list" id="railList"></div>

      <button class="mini" id="backupBtn">백업 저장</button>
      <button class="mini" id="importBtn">가져오기</button>

      <button class="mini" onclick="openDict()">📖 사전</button>
      <button class="mini" id="setBtn">설정</button>
    </div>
  </aside>
  <button class="rail-open" onclick="toggleRail()" title="사이드바 열기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <main class="main">
    <div class="course-band" id="band"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>
<div id="printRoot"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">
<input type="file" id="attInput" style="display:none">

<script>

function setAccent(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  document.documentElement.style.setProperty('--c',hex);
  document.documentElement.style.setProperty('--c-soft',`rgba(${r},${g},${b},.10)`);
  document.documentElement.style.setProperty('--c-deep',`rgb(${Math.round(r*.55)},${Math.round(g*.55)},${Math.round(b*.55)})`);
}

function bindListDnD(arrGetter,setter){
  const list=document.querySelector('.sess-scroll'); if(!list)return;
  let dragEl=null;
  list.querySelectorAll('.sess-item[draggable]').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragEl=row;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');dragEl=null;
      const ids=[...list.querySelectorAll('.sess-item[draggable]')].map(r=>r.dataset.id);
      const arr=arrGetter(); const byId={}; arr.forEach(x=>byId[x.id]=x);
      setter(ids.map(id=>byId[id]).filter(Boolean)); save(); render();});
    row.addEventListener('dragover',e=>{e.preventDefault(); if(!dragEl||dragEl===row)return;
      const r=row.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2;
      list.insertBefore(dragEl,before?row:row.nextSibling);});
  });
}

function bindDnD(){
  const list=document.getElementById('caseList'); if(!list)return;
  let dragEl=null;
  list.querySelectorAll('.case-row').forEach(row=>{
    row.addEventListener('dragstart',()=>{dragEl=row;row.classList.add('dragging');});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');dragEl=null;persistOrder();});
    row.addEventListener('dragover',e=>{e.preventDefault();
      if(!dragEl||dragEl===row)return;
      const r=row.getBoundingClientRect();
      const before=(e.clientY-r.top)<r.height/2;
      list.insertBefore(dragEl,before?row:row.nextSibling);});
  });
  function persistOrder(){

function renderOutline(c){
  let h=`<div class="outline-doc"><h2>${esc(c.name)} — Exam Outline</h2>
    <div class="osub">본인 작성 아웃라인 (시험 반입용) · ${new Date().toLocaleDateString('ko-KR')} 출력</div>`;
  let lastU="",any=false;
  c.sessions.forEach(s=>{
    const r=strip(s.rule),o=strip(s.outline);
    const names=s.cases.map(id=>strip((kase(id)||{}).name)).filter(Boolean);
    if(!r&&!o&&!names.length)return;
    any=true;
    if(s.unit&&s.unit!==lastU){h+=`<div class="out-unit">${esc(s.unit)}</div>`;lastU=s.unit;}
    h+=`<div class="out-item"><h4>${esc(strip(s.title))} <span class="pg">${esc(s.pages)}</span></h4>`;
    if(r)h+=`<div class="out-rule">${s.rule}</div>`;
    if(o)h+=`<div class="out-line">▸ ${s.outline}</div>`;
    if(names.length)h+=`<div class="out-cases">${esc(names.join(" · "))}</div>`;
    h+=`</div>`;
  });
  if(!any)h+=`<p class="empty" style="margin-top:22px;">각 세션의 [Black-letter Rule]과 [아웃라인 한 줄]을 채우면 여기에 자동으로 쌓입니다.</p>`;
  return h+`</div>`;
}

/* ================= attachments (IndexedDB — 대용량 PDF/이미지) ================= */
let _db=null;
function idb(){return new Promise((res,rej)=>{ if(_db)return res(_db);
  const q=indexedDB.open("lawprep-files",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("files");
  q.onsuccess=()=>{_db=q.result;res(_db);}; q.onerror=()=>rej(q.error);});}
async function idbPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("files","readwrite");tx.objectStore("files").put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(id){try{const d=await idb();return await new Promise((res,rej)=>{const r=d.transaction("files").objectStore("files").get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function idbDel(id){try{const d=await idb();return await new Promise(res=>{const tx=d.transaction("files","readwrite");tx.objectStore("files").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}
async function idbKeys(){try{const d=await idb();return await new Promise(res=>{const r=d.transaction("files").objectStore("files").getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);});}catch(e){return [];}}
function pickFile(accept,cb){const inp=document.getElementById('attInput');inp.accept=accept;
  inp.onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)cb(f);};inp.click();}
function attIdsInHtml(html){const ids=[];const re=/data-att="([^"]+)"/g;let m;while((m=re.exec(html||"")))ids.push(m[1]);return ids;}
async function hydrateAtts(root){
  if(!root)return;
  for(const el of root.querySelectorAll('[data-att]')){
    const f=await idbGet(el.dataset.att);
    if(!f){el.classList.add('att-missing');continue;}
    el.classList.remove('att-missing');
    const url=URL.createObjectURL(f);
    if(el.tagName==='IMG'){if(!el.src)el.src=url;}
    else{const fr=el.querySelector('.pdfframe'); if(fr&&!fr.src)fr.src=url;
      const nm=el.querySelector('.pdfname'); if(nm&&!strip(nm.textContent)&&f.name)nm.textContent=f.name;}
  }
}

/* 화면에 보이는 그대로 인쇄: 편집 UI만 걷어낸 복제본 */
function liveClone(el){
  const cl=el.cloneNode(true);
  cl.querySelectorAll('button,.blk-tools,.memo-add,.fmtbar,.tbl-tools,.pdfframe,.sess-tools,.sess-col,.addblock,.linkish,select,input[type=file]').forEach(x=>x.remove());
  cl.querySelectorAll('[contenteditable]').forEach(x=>{x.removeAttribute('contenteditable'); x.classList.add('p-ed'); if(!strip(x.innerHTML)&&!x.querySelector('img,table')){x.classList.add('p-empty');} x.removeAttribute('data-ph');});
  cl.querySelectorAll('input[type=date],input[type=checkbox]').forEach(x=>{const sp=document.createElement('span');sp.textContent=x.type==='checkbox'?(x.checked?'☑ ':'☐ '):x.value;x.replaceWith(sp);});
  cl.querySelectorAll('.empty').forEach(x=>(x.closest('tr')||x).remove());
  cl.querySelectorAll('.hint,.memo-add').forEach(x=>x.remove());
  // 빈 소제목(라벨만 있고 내용 없는 것) 정리
  cl.querySelectorAll('.arg-col').forEach(col=>{if(!col.querySelector('.arg-item'))col.remove();});
  cl.querySelectorAll('.arg-grid').forEach(g=>{if(!g.children.length)g.remove();});
  cl.querySelectorAll('.p-empty').forEach(e=>{const prev=e.previousElementSibling; if(prev&&prev.classList.contains('bk-sub'))prev.remove(); e.remove();});
  cl.querySelectorAll('.bk-pair>div,.bk-pair>*').forEach(d=>{if(!strip(d.innerHTML)||!d.querySelector('.bk-ed,[data-key],img'))d.remove();});
  // 내용이 전혀 없는 블록은 빼기
  const has=el=>strip(el.innerHTML)||el.querySelector('img');
  cl.querySelectorAll('#caseCards').forEach(x=>x.closest('.blk')?.remove()); // 리딩노트 인쇄에 판례 블록 제외
  cl.querySelectorAll('.bk,.blk,.card').forEach(b=>{if(b.querySelector('.bk,.blk'))return; const body=b.querySelector('.bk-body,.blk-body,.card-body'); if(!body)return;
    const cells=[...body.querySelectorAll('.p-ed,tbody tr,img')];
    if(!cells.some(has)&&!body.querySelector('img,tbody tr,.att,.pdfhead'))b.remove();});
  cl.querySelectorAll('.memos').forEach(m=>{if(!m.querySelector('.memo,.pdfhead,.att,img')&&!strip((m.querySelector('#memoGrid,#attList,.memo-grid')||{innerHTML:''}).innerHTML))m.remove();});
  cl.querySelectorAll('.memos').forEach(m=>{const g=m.querySelector('.memo-grid,#attList'); if(g&&!g.children.length)m.remove();});
  return `<div class="p-live">${cl.outerHTML}</div>`;
}
function doPrint(){

  if(V.page==='home'){toast("과목 화면에서 내보낼 수 있습니다");return;}

  else if(V.tab==='read'){const el=document.querySelector('.read-grid>div:last-child'); const s=sess(c,V.sessionId); pr.innerHTML=el&&s?liveClone(el):printSessHTML(c,s);}

  }
  else {toast("브리프를 열거나 아웃라인 탭에서 내보내세요");return;}
  window.print();
}

document.getElementById('gsearch').addEventListener('input',e=>{

    const hay=(strip(s.title)+" "+s.pages+" "+strip(s.summary||"")+" "+strip(s.rule||"")+" "+strip(s.outline||"")+" "+sessText(s)).toLowerCase();
    if(hay.includes(q))hits.push({t:strip(s.title),w:`${c.name} · 리딩노트`,go:()=>{V.sessionId=s.id;go('course',c.id,'read');}});
  }));
  S.courses.forEach(c=>(c.notes||[]).forEach(n=>{
    const hay=(strip(n.title)+" "+(n.date||"")+" "+strip(n.body)).toLowerCase();
    if(hay.includes(q))hits.push({t:strip(n.title)||"(제목 없음)",w:`${c.name} · 수업노트`,go:()=>{go('course',c.id,'notes');V.noteId=n.id;render();}});
  }));
  S.cases.forEach(k=>{
    const hay=(strip(k.name)+" "+strip(k.cite)+" "+strip(k.facts)+" "+strip(k.rule)+" "+strip(k.issue)+" "+strip(k.analysis)+" "+Object.values(k.fields||{}).map(strip).join(" ")+" "+(k.vocab||[]).map(v=>strip(v.term)).join(" ")+" "+(k.timeline||[]).map(t=>strip(t.what)).join(" ")).toLowerCase();
    if(hay.includes(q)){const cn=(course(k.courseId)||{}).name||"미분류";
      hits.push({t:strip(k.name)||"(제목 없음)",w:`${cn} · 판례`,go:()=>openBrief(k.id)});}
  });
  window._hits=hits;

    <div class="sr">${hits.map((h,i)=>`<button onclick="_hits[${i}].go();document.getElementById('gsearch').value=''">
      ${esc(h.t)}<span class="where"> — ${esc(h.w)}</span></button>`).join("")||'<div class="empty" style="padding:12px;">결과 없음</div>'}</div>`;
});

  openModal(`<h3>설정</h3>${msg?`<p>⚠️ ${esc(msg)}</p>`:""}
    <p>Claude 안에서 열면 AI 기능이 바로 작동합니다. 일반 브라우저(GitHub Pages)에서는 기존에 쓰던 Cloudflare Worker 릴레이 주소를 넣어주세요.</p>
    <label>Cloudflare Worker 주소</label><input type="url" id="mWorker" value="${esc(S.settings.worker)}" placeholder="https://….workers.dev">
    <div class="row"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="mOk">저장</button></div>`);
  document.getElementById('mOk').onclick=()=>{S.settings.worker=document.getElementById('mWorker').value.trim();save();closeModal();toast("설정 저장됨");};
}
document.getElementById('setBtn').onclick=()=>openSettings();
document.getElementById('appName').addEventListener('input',e=>{S.title=e.target.textContent;save();});
document.getElementById('backupBtn').onclick=async()=>{
  let atts=[];
  const keys=await idbKeys();
  if(keys.length&&confirm(`이미지/PDF 첨부 ${keys.length}개까지 포함해서 백업할까요?\n(확인 = 전체 백업, 파일이 커질 수 있음 · 취소 = 글만 백업)`)){
    for(const id of keys){
      const f=await idbGet(id); if(!f)continue;
      const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f);});
      if(data)atts.push({id,name:f.name||"file",data});
    }
  }
  const payload=atts.length?{...S,_atts:atts}:S;
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`1L-prep-${new Date().toISOString().slice(0,10)}.json`; a.click();
  toast(atts.length?`첨부 ${atts.length}개 포함 백업 완료`:"백업 완료");
};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{routeImport(JSON.parse(r.result));}catch(err){alert("JSON 파일을 읽을 수 없습니다.");}};
  r.readAsText(f); e.target.value="";
};
function routeImport(j){
  if(j&&j.courses&&j.cases){ /* full backup */
    if(!confirm("전체 백업을 불러옵니다. 현재 내용을 대체할까요? (취소하면 병합하지 않음)"))return;
    const atts=j._atts||[]; delete j._atts;
    S=j; S.courses.forEach(c=>{if(!c.notes)c.notes=[];}); S.cases.forEach(k=>{if(!k.atts)k.atts=[];});
    save();
    (async()=>{
      for(const a of atts){
        try{const blob=await (await fetch(a.data)).blob();
          await idbPut(a.id,new File([blob],a.name||"file",{type:blob.type}));}catch(e){}
      }
      if(atts.length)toast(`첨부 ${atts.length}개 복원 완료`);
    })();
    go('home'); toast("백업을 불러왔습니다"); return;
  }
  if(j&&typeof j==='object'&&Object.values(j).some(v=>v&&(v.summary!==undefined||v.briefs!==undefined))){
    importReadingJSON(j); return;
  }
  const arr=Array.isArray(j)?j:(j.cases||j.briefs||null);
  if(arr){importOldCases(arr);return;}
  alert("알 수 없는 형식입니다. 이 앱/이전 도구에서 저장한 백업 파일인지 확인해 주세요.");
}
/* reading-notes JSON (Contracts/Torts 템플릿 백업) */
function importReadingJSON(j){
  openModal(`<h3>리딩노트 백업 가져오기</h3><p>어느 과목의 세션에 넣을까요? 세션 번호 순서대로 매칭됩니다.</p>
    <label>과목</label><select id="mC">${S.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
    <div class="row"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="mOk">가져오기</button></div>`);
  document.getElementById('mOk').onclick=()=>{
    const c=course(document.getElementById('mC').value);
    let nS=0,nB=0;
    Object.entries(j).forEach(([i,d])=>{
      if(!d||typeof d!=='object')return;
      const idx=+i; let s=c.sessions[idx];
      if(!s){s=mkSess("","Imported session "+(idx+1),"");c.sessions[idx]=s;}
      if(d.summary||d.rule||d.questions)delete s.blocks;
      if(d.summary)s.summary=d.summary; if(d.rule)s.rule=d.rule;
      if(d.outline)s.outline=d.outline; if(d.questions)s.questions=d.questions;
      if(d.date)s.date=d.date; if(d.done)s.done=true;
      (d.qa||[]).forEach(q=>s.cold.push({q:q.q||"",a:q.a||""}));
      normSess(s,c);
      (d.briefs||[]).forEach(b=>{
        const k=Object.assign(mkCase(c.id),{name:b.name||"",cite:b.cite||"",facts:b.facts||"",issue:b.issue||"",
          rule:b.rule||"",analysis:b.analysis||"",concl:b.concl||b.conclusion||""});
        S.cases.push(k); s.cases.push(k.id); nB++;});
      nS++;
    });
    c.sessions=c.sessions.filter(Boolean);
    save(); closeModal(); go('course',c.id,'read'); toast(`세션 ${nS}개, 브리프 ${nB}개를 가져왔습니다`);
  };
}
/* 이전 Casebook 데이터 (필드명 최대한 매핑) */
function mapOld(o){
  if(!o||typeof o!=='object')return null;
  const name=o.name||o.title||o.caseName||o.case||"";
  if(!name&&!o.facts&&!o.issue)return null;
  return {id:uid(),courseId:null,tpl:null,fields:{},vocab:[],opinion:[],args:{pa:[],px:[],da:[],dx:[]},_course:o.course||o.courseName||o.category||"",
    name:String(name),cite:o.cite||o.citation||o.court||"",
    facts:o.facts||"",issue:o.issue||"",rule:o.rule||o.holding||"",
    analysis:o.analysis||o.reasoning||o.rationale||"",concl:o.concl||o.conclusion||o.disposition||"",
    memos:(o.memos||[]).map(m=>({type:m.type&&MEMO[m.type]?m.type:"mine",text:m.text||String(m)}))
      .concat(o.notes?[{type:"mine",text:typeof o.notes==='string'?o.notes:JSON.stringify(o.notes)}]:[]),
    atts:[],created:o.created||Date.now()};
}
function importOldCases(arr){
  const mapped=arr.map(mapOld).filter(Boolean);
  if(!mapped.length){alert("가져올 브리프를 찾지 못했습니다.");return;}
  mapped.forEach(k=>{
    const byName=S.courses.find(c=>c.name.toLowerCase()===(k._course||"").toLowerCase());
    k.courseId=byName?byName.id:(V.courseId||S.courses[0].id);
    delete k._course; normCase(k); S.cases.push(k);
  });
  save(); render(); toast(`브리프 ${mapped.length}개를 가져왔습니다`);
}
/* 같은 주소(localStorage)에 남아 있는 이전 Casebook 데이터 스캔 */
function scanOld(silent){
  let found=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key===KEY)continue;
    try{
      const j=JSON.parse(localStorage.getItem(key));
      const arr=Array.isArray(j)?j:(j&&(j.cases||j.briefs));
      if(Array.isArray(arr)&&arr.length&&arr.some(o=>o&&(o.name||o.title||o.caseName)&&(o.facts!==undefined||o.issue!==undefined||o.rule!==undefined||o.holding!==undefined||o.brief!==undefined)))
        found.push({key,count:arr.length,arr});
    }catch(e){}
  }
  if(!found.length){if(!silent)toast("이 브라우저에서 이전 Casebook 데이터를 찾지 못했습니다");return;}
  const f=found[0];
  openModal(`<h3>이전 Casebook 데이터 발견</h3>
    <p>이 주소의 브라우저 저장소에서 브리프 ${f.count}건(저장 키: ${esc(f.key)})을 찾았습니다. 원본은 지우지 않고 복사해서 가져옵니다.</p>
    <div class="row"><button class="btn" id="mRaw">원본 JSON 다운로드</button>
      <button class="btn" onclick="closeModal()">나중에</button><button class="btn pri" id="mOk">가져오기</button></div>`);
  document.getElementById('mOk').onclick=()=>{closeModal();importOldCases(f.arr);};
  document.getElementById('mRaw').onclick=()=>{
    const blob=new Blob([JSON.stringify(f.arr,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`old-casebook-${f.key}.json`; a.click();
  };
}
document.getElementById('scanBtn').onclick=()=>scanOld(false);

/* ================= case factory / templates ================= */
const CORE=["facts","issue","rule","analysis","concl"];
function mkCase(courseId,tpl){
  const c=course(courseId);
  return {id:uid(),courseId,tpl:tpl||(c&&c.template)||"irac",name:"",cite:"",facts:"",issue:"",rule:"",analysis:"",concl:"",
    fields:{},vocab:[],opinion:[],args:{pa:[],px:[],da:[],dx:[]},memos:[],atts:[],created:Date.now()};
}
function normCase(k){
  if(!k.tpl){const c=course(k.courseId);k.tpl=(c&&c.template)||"irac";}
  if(!k.fields)k.fields={}; if(!k.ko)k.ko={}; if(!k.vocab)k.vocab=[]; if(!k.opinion)k.opinion=[];
  if(k.koOn===undefined)k.koOn=Object.values(k.ko).some(v=>strip(v||""));
  if(!k.args)k.args={pa:[],px:[],da:[],dx:[]}; if(!k.memos)k.memos=[]; if(!k.atts)k.atts=[];
}
const getF=(k,key)=>CORE.includes(key)?(k[key]||""):((k.fields||{})[key]||"");
const setF=(k,key,v)=>{if(CORE.includes(key))k[key]=v;else{if(!k.fields)k.fields={};k.fields[key]=v;}};

const tplOf=k=>TPL[k.tpl]||TPL.irac;

/* ================= brief editor (템플릿 렌더) ================= */
function blockHead(b){
  return `<div class="bk-head"><span class="bk-tag" style="background:${b.col}">${esc(b.tag)}</span><h3>${esc(b.t)}</h3>${b.hint?`<span class="hint">${esc(b.hint)}</span>`:""}</div>`;
}
function tplOrder(t){ if(!S.tplOrder)S.tplOrder={}; const n=TPL[t].blocks.length; let o=S.tplOrder[t]; if(!o||o.length!==n||o.some(x=>x<0||x>=n)||new Set(o).size!==n){ o=[...Array(n).keys()]; S.tplOrder[t]=o; } return o; }
function mvBk(t,pos,d){ const o=tplOrder(t); const j=pos+d; if(j<0||j>=o.length)return; [o[pos],o[j]]=[o[j],o[pos]]; save(); render(); }
function resetBk(t){ if(!S.tplOrder)S.tplOrder={}; delete S.tplOrder[t]; save(); render(); toast("기본 순서로"); }
function renderBlock(k,b,i,pos,n){
  let body="";
  const koBox=key=>k.koOn?`<div contenteditable class="bk-ko" data-ko="${key}" data-ph="한국어 — 직접 쓰거나 위 칸을 [한국어로 번역]">${k.ko[key]||""}</div>`:"";
  if(b.type==="field"){
    body=`<div contenteditable class="bk-ed" data-key="${b.key}" data-ph="${esc(b.ph||"")}">${getF(k,b.key)}</div>${koBox(b.key)}`;
  }else if(b.type==="pair"){
    body=`<div class="bk-pair">${b.keys.map((key,j)=>`<div><div class="bk-sub">${esc(b.labels[j])}</div>
      <div contenteditable class="bk-ed" data-key="${key}" data-ph="${esc(b.ph[j]||"")}">${getF(k,key)}</div>${koBox(key)}</div>`).join("")}</div>`;
  }else if(b.type==="parties"){
    body=`<div class="bk-pair">
      <div class="party p"><div class="bk-sub">Plaintiff (원고) — 누구?</div><div contenteditable class="bk-ed" data-key="pWho" data-ph="예: Burch, 주택 구매자">${getF(k,"pWho")}</div>
        <div class="bk-sub">원고의 입장</div><div contenteditable class="bk-ed" data-key="pStance" data-ph="한 줄: 무엇을 주장하며 무엇을 원하는가">${getF(k,"pStance")}</div>${koBox("pStance")}</div>
      <div class="party d"><div class="bk-sub">Defendant (피고) — 누구?</div><div contenteditable class="bk-ed" data-key="dWho" data-ph="예: 건설사">${getF(k,"dWho")}</div>
        <div class="bk-sub">피고의 입장</div><div contenteditable class="bk-ed" data-key="dStance" data-ph="한 줄: 어떤 항변을 하는가">${getF(k,"dStance")}</div>${koBox("dStance")}</div></div>
      <div class="bk-sub" style="margin-top:10px;">Procedural posture (소송 경위)</div><div contenteditable class="bk-ed" data-key="posture" data-ph="누가 소를 제기 → 하급심 결과 → 누가 항소">${getF(k,"posture")}</div>`;
  }else if(b.type==="timeline"){
    if(!k.timeline)k.timeline=[];
    body=`<div class="tl">${k.timeline.map((it,i)=>`<div class="tl-row"><div class="tl-when" contenteditable data-tl="${i}" data-k="when" data-ph="날짜/순서">${it.when||""}</div><div class="tl-what" contenteditable data-tl="${i}" data-k="what" data-ph="무슨 일이 있었나 (교재 표현 그대로)">${it.what||""}</div><button class="rm" onclick="rmTL(${i})">✕</button></div>`).join("")}</div>
      <button class="chip add" onclick="addTL()">＋ 항목</button>`;
  }else if(b.type==="vocab"){
    body=`<div id="vocabBox"></div>`;
  }else if(b.type==="opinion"){
    body=`<div id="opBox"></div>`;
  }else if(b.type==="args"){
    body=`<div id="argBox"></div>`;
  }
  const tools=pos===undefined?"":`<span class="blk-tools"><button class="mini" onclick="mvBk('${k.tpl}',${pos},-1)" title="위로">▲</button><button class="mini" onclick="mvBk('${k.tpl}',${pos},1)" title="아래로">▼</button></span>`;
  return `<div class="bk" data-bi="${i}">${blockHead(b).replace('</div>',tools+'</div>')}<div class="bk-body">${body}</div></div>`;
}

/* ================= AI helpers ================= */
async function aiJSON(prompt,useSearch,_retry){
  const body=JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}],
    ...(useSearch?{tools:[{type:"web_search_20250305",name:"web_search"}]}:{})});
  let data,status=0;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body});
    status=r.status; if(r.ok)data=await r.json(); else throw new Error("direct-fail");
  }catch(e){
    const w=(S.settings.worker||"").trim(); if(!w)throw new Error("no-relay");
    let r; try{r=await fetch(w,{method:"POST",headers:{"Content-Type":"application/json"},body});}catch(e2){throw new Error("relay-net");}
    if(!r.ok){const t=await r.text().catch(()=>""); throw new Error("relay-"+r.status+(t?": "+t.slice(0,120):""));}
    data=await r.json();
  }
  if(data.error)throw new Error("api: "+(data.error.message||JSON.stringify(data.error)).slice(0,140));
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const clean=text.replace(/```json|```/g,"").trim();
  const m=clean.match(/[\[{][\s\S]*[\]}]/);
  try{ if(!m)throw 0; return JSON.parse(m[0]); }
  catch(e){
    /* 검색 결과 때문에 응답이 길어져 잘린 경우 → 검색 없이, 더 짧게 한 번 더 */
    if(!_retry)return aiJSON(prompt+"\nIMPORTANT: Output must be complete valid JSON under 600 words total. Shorten every field.",false,true);
    throw new Error("parse");
  }
}
function aiErr(e){
  if(e.message==="no-relay")openSettings("일반 브라우저에서는 Cloudflare Worker 릴레이 주소가 필요합니다.");
  else if(e.message==="parse")toast("응답이 잘렸거나 형식이 달라요 — 언어를 English로 바꾸거나 한 번 더 시도해 보세요");
  else if(e.message==="relay-net")toast("릴레이 주소에 접속할 수 없어요 — 설정의 Worker 주소를 확인하세요");
  else toast("생성 실패: "+e.message);
}
const BRIEF_PROMPT={
  irac:`{"name":"Case v. Name","cite":"Court, Reporter citation (Year)","facts":"...","issue":"...","rule":"...","analysis":"court's reasoning","concl":"holding + disposition"}`,
  torts:`{"name":"Case v. Name","cite":"Court, Reporter citation (Year)","facts":"recitation of the facts a student can read aloud: parties, what happened, procedural history","relFacts":"the facts that decide the outcome, numbered","irrFacts":"background facts that don't matter","concl":"RESULT: who won and the disposition","rule":"RULE OF LAW with elements","analysis":"the court's reasons, one by one","hidden":"issues the court did not address or assumptions it made","policy":"policy considerations for and against the rule","connect":"related doctrines or classic torts cases it connects to"}`,
  contracts:`{"name":"Case v. Name","cite":"Court, Reporter citation (Year)","pWho":"who the plaintiff is","pStance":"plaintiff's position in one sentence","dWho":"who the defendant is","dStance":"defendant's position in one sentence","posture":"procedural history","facts":"facts written to be read aloud","issue":"...","rule":"rule with elements; cite Restatement/UCC if applicable","analysis":"application of rule to facts","concl":"holding + disposition","critP":"what plaintiff's lawyers did well or should have done","critD":"what defendant's lawyers did well or should have done"}`
};

      if(!k.name)k.name=esc(q);

let _dictSel="",_dictBtn=null,_dictPanel=null;
function ensureDictUI(){
  if(_dictBtn)return;
  _dictBtn=document.createElement('button'); _dictBtn.className='dict-bubble'; _dictBtn.textContent='📖 사전';
  _dictBtn.onmousedown=e=>e.preventDefault(); _dictBtn.onclick=()=>{lookup(_dictSel);_dictBtn.style.display='none';};
  document.body.appendChild(_dictBtn);
  _dictPanel=document.createElement('div'); _dictPanel.className='dict-panel'; document.body.appendChild(_dictPanel);
}
document.addEventListener('mouseup',e=>{
  ensureDictUI();
  if(e.target.closest('.dict-panel,.dict-bubble,.modal'))return;
  setTimeout(()=>{
    const sel=getSelection(); const t=(sel&&sel.toString()||"").trim();
    if(!t||t.length>60||t.split(/\s+/).length>5||!document.getElementById('view').contains(sel.anchorNode)){_dictBtn.style.display='none';return;}
    _dictSel=t; const r=sel.getRangeAt(0).getBoundingClientRect();
    _dictBtn.style.display='block'; _dictBtn.style.left=Math.max(8,r.left+window.scrollX)+"px"; _dictBtn.style.top=(r.top+window.scrollY-34)+"px";
  },0);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDict();});
function openDict(){
  ensureDictUI();
  const sel=(getSelection()&&getSelection().toString()||"").trim();
  if(sel&&sel.length<=60)return lookup(sel);
  _dictPanel.innerHTML=`<div class="dict-head"><b>📖 사전</b><span style="flex:1"></span><button class="mini" onclick="closeDict()">닫기</button></div>
    <div class="dict-row"><input id="dictQ" placeholder="영어 단어·법률 용어 (예: consideration, promissory estoppel)"><button class="btn pri" onclick="lookup(document.getElementById('dictQ').value)">찾기</button></div>
    <div class="dict-hint">본문에서 단어를 드래그하면 📖 버튼이 뜹니다. 결과는 이 브라우저에 저장되어 다음엔 바로 나옵니다.</div>`;
  _dictPanel.classList.add('show'); setTimeout(()=>document.getElementById('dictQ')?.focus(),50);
}
function closeDict(){if(_dictPanel)_dictPanel.classList.remove('show'); if(_dictBtn)_dictBtn.style.display='none';}
function dictLinks(t){const q=encodeURIComponent(t);
  return `<div class="dict-links"><a target="_blank" href="https://en.dict.naver.com/#/search?query=${q}">네이버 영어사전 ↗</a><a target="_blank" href="https://www.law.cornell.edu/wex/${encodeURIComponent(t.toLowerCase().replace(/\s+/g,'_'))}">Cornell Wex ↗</a><a target="_blank" href="https://www.merriam-webster.com/legal/${q}">MW Legal ↗</a></div>`;}
async function lookup(term){
  ensureDictUI(); term=(term||"").trim().replace(/[.,;:"'()]+$/,""); if(!term)return;
  if(!S.dict)S.dict={};
  const inBrief=!!(V.tab==='cases'&&V.caseId);
  const show=(d,loading)=>{
    _dictPanel.innerHTML=`<div class="dict-head"><b>📖 ${esc(term)}</b>${d&&d.pos?`<span class="dict-pos">${esc(d.pos)}</span>`:""}<span style="flex:1"></span>
        <button class="mini" onclick="openDict()">다른 단어</button><button class="mini" onclick="closeDict()">닫기</button></div>
      ${loading?`<div class="dict-hint"><span class="spin" style="border-color:var(--c);border-top-color:transparent"></span> 찾는 중…</div>`:d?`
      <div class="dict-ko">${esc(d.ko||"")}</div>
      <div class="dict-en">${esc(d.en||"")}</div>
      ${d.legal?`<div class="dict-legal"><b>법률 맥락</b> ${esc(d.legal)}</div>`:""}
      ${d.example?`<div class="dict-ex">“${esc(d.example)}”</div>`:""}
      <div class="dict-row" style="margin-top:8px;">${inBrief?`<button class="btn pri" onclick="addVocab('${esc(term).replace(/'/g,"&#39;")}','${esc(d.en||"").replace(/'/g,"&#39;")}','${esc(d.ko||"").replace(/'/g,"&#39;")}');toast('단어장에 추가');">＋ 이 판례 단어장에</button>`:""}
        <button class="btn" onclick="delete S.dict[${JSON.stringify(term.toLowerCase())}];lookup(${JSON.stringify(term)})">다시 찾기</button></div>`:`<div class="dict-hint">찾지 못했습니다. 아래 링크로 열어 보세요.</div>`}
      ${dictLinks(term)}`;
    _dictPanel.classList.add('show');
  };
  const key=term.toLowerCase();
  if(S.dict[key]){show(S.dict[key]);return;}
  show(null,true);
  try{
    const j=await aiJSON(`You are an English–Korean legal dictionary for a Korean first-year U.S. law student. Term: "${term}". Respond with ONLY JSON, no markdown: {"pos":"part of speech","ko":"한국어 뜻 (핵심 1–2개, 법률 용어면 법률적 번역 우선)","en":"plain-English definition ≤25 words","legal":"how it is used in U.S. law / contracts / torts, ≤30 words (empty string if not a legal term)","example":"one short example sentence from a legal context"}`);
    S.dict[key]=j; save(); show(j);
  }catch(e){
    if(e.message==="no-relay"){_dictPanel.classList.remove('show');openSettings("사전(AI)을 일반 브라우저에서 쓰려면 릴레이 주소가 필요합니다.");}
    else show(null);
  }
}

function printBriefHTML(k){

    const tag=b?.tag||"";

      </td>
      <td style="padding:10px 14px 10px 0;vertical-align:top;font-size:11pt;line-height:1.8;color:#374151;">${v}${key&&strip(k.ko[key]||"")?`<div style="font-size:9.5pt;color:#666;margin-top:4px;line-height:1.6;">${k.ko[key]}</div>`:""}</td>

    else if(b.type==="pair")b.keys.forEach((key,j)=>rows+=row(b.labels[j],getF(k,key),key,b));

    else if(b.type==="parties"){rows+=row("Plaintiff",[getF(k,"pWho"),getF(k,"pStance")].filter(strip).join(" — "));rows+=row("Defendant",[getF(k,"dWho"),getF(k,"dStance")].filter(strip).join(" — "));rows+=row("Posture",getF(k,"posture"));}
    else if(b.type==="vocab"&&k.vocab.length)rows+=row("단어장",`<table style="width:100%;border-collapse:collapse;font-size:10pt;">${k.vocab.map(v=>`<tr><td style="padding:3px 8px 3px 0;font-weight:700;vertical-align:top;white-space:nowrap;width:100px;">${v.term}</td><td style="padding:3px 8px 3px 0;width:100px;">${v.en}</td><td style="padding:3px 0;color:#555;">${v.ko}${strip(v.note)?` <span style="color:#999;font-size:9pt;">(${v.note})</span>`:""}</td></tr>`).join("")}</table>`,null,b);
    else if(b.type==="args"&&["pa","px","da","dx"].some(x=>k.args[x].length))rows+=row("Arguments",ARG.map(([key,label])=>k.args[key].length?`<div style="margin-bottom:5px;"><b>${label}</b><ul style="margin:2px 0 0 16px;padding:0;">${k.args[key].map(a=>`<li>${a}</li>`).join("")}</ul></div>`:"").join(""));

  });
  return `<div class="p-brief" style="padding:24px;page-break-inside:avoid;">

    <table style="width:100%;border-collapse:collapse;print-color-adjust:exact;-webkit-print-color-adjust:exact;border:1px solid #d1d5db;border-radius:6px;overflow:hidden;">${rows}</table>

/* ================= 리딩노트: 자유 블록 ================= */

function mkBlock(type,title){const b={id:uid(),type,title:title||BLOCK_TYPES[type].label}; if(type==="text")b.html=""; if(type==="concepts"||type==="terms")b.items=[]; return b;}
function normSess(s,c){
  if(!s.cold)s.cold=[]; if(!s.cases)s.cases=[];
  if(s.blocks)return;
  const bl=[];
  if(strip(s.summary||""))bl.push(Object.assign(mkBlock("text","리딩 요약"),{html:s.summary}));
  if(strip(s.rule||""))bl.push(Object.assign(mkBlock("text","Black-letter Rule"),{html:s.rule}));
  if(bl.length){ bl.push(mkBlock("cases"),mkBlock("cold")); if(strip(s.questions||""))bl.push(Object.assign(mkBlock("text","질문 · 오피스아워"),{html:s.questions})); }
  else if(c&&c.template==="torts") bl.push(mkBlock("cases"),mkBlock("cold"),mkBlock("concepts"),mkBlock("terms"),mkBlock("text"));
  else bl.push(mkBlock("concepts"),mkBlock("terms"),mkBlock("cases"),mkBlock("cold"),mkBlock("text"));
  s.blocks=bl;
}
function blockText(b){ if(b.type==="text")return strip(b.html||""); if(b.items)return b.items.map(i=>Object.values(i).map(strip).join(" ")).join(" "); return ""; }

function addItem(bid){const s=curSess(); const b=s.blocks.find(x=>x.id===bid); b.items.push(b.type==="terms"?{term:"",en:"",ko:""}:{name:"",body:""}); save(); render();
  setTimeout(()=>{const els=document.querySelectorAll(`[data-b="${bid}"][data-j]`); const last=els[els.length-(b.type==="terms"?3:2)]; last&&last.focus();},30);}
function rmItem(bid,j){const s=curSess(); const b=s.blocks.find(x=>x.id===bid); b.items.splice(j,1); save(); render();}
function bindRead(c){
  const s=sess(c,V.sessionId); if(!s){bindListDnD(()=>c.sessions,a=>{c.sessions=a;});return;}
  const bind=(id,key)=>{const el=document.getElementById(id); if(!el)return; el.addEventListener('input',()=>{s[key]=el.innerHTML;save();});};
  bind('eOutline','outline');

document.addEventListener('keydown',e=>{
  if(e.key!==' ')return;
  const el=e.target; if(!el||!el.isContentEditable)return;
  const sel=getSelection(); if(!sel.rangeCount||!sel.isCollapsed)return;
  const r=sel.getRangeAt(0); const node=r.startContainer; if(node.nodeType!==3)return;
  const before=node.textContent.slice(0,r.startOffset);
  const m=before.match(/^(-|\*|•|1\.)$/); if(!m)return;
  if(node.parentElement.closest('li'))return;
  let p=node.previousSibling; while(p){ if(p.nodeName==='BR')break; if((p.textContent||'').trim())return; p=p.previousSibling; }
  e.preventDefault();
  node.textContent=node.textContent.slice(r.startOffset);
  const nr=document.createRange();
  if(node.textContent===''){ const br=document.createElement('br'); const par=node.parentNode; par.replaceChild(br,node); nr.setStart(par,Array.prototype.indexOf.call(par.childNodes,br)); }
  else nr.setStart(node,0);
  nr.collapse(true); sel.removeAllRanges(); sel.addRange(nr);
  document.execCommand(m[1]==='1.'?'insertOrderedList':'insertUnorderedList',false,null);
  el.dispatchEvent(new Event('input',{bubbles:true}));
});
function clearStyle(prop,quiet){
  const sel=getSelection(); if(!sel.rangeCount)return; const r=sel.getRangeAt(0); if(r.collapsed){if(!quiet)toast("지울 부분을 먼저 드래그하세요");return;}
  const sc=r.commonAncestorContainer; const ed=(sc.nodeType===3?sc.parentElement:sc).closest('[contenteditable]'); if(!ed)return;
  document.execCommand('styleWithCSS',false,true);
  if(prop==='color')document.execCommand('foreColor',false,'#010203'); else document.execCommand('hiliteColor',false,'#fefdfc');
  const sentinel=prop==='color'?'rgb(1, 2, 3)':'rgb(254, 253, 252)';
  ed.querySelectorAll('[style]').forEach(el=>{
    if(el.style.getPropertyValue(prop)===sentinel)el.style.removeProperty(prop);
    if(prop==='background-color'&&el.style.backgroundColor===sentinel)el.style.removeProperty('background-color');
    if(!el.getAttribute('style')||!el.getAttribute('style').trim())el.removeAttribute('style');
    if(el.tagName==='SPAN'&&!el.attributes.length)el.replaceWith(...el.childNodes);
  });
  ed.querySelectorAll('font[color="#010203"]').forEach(el=>el.replaceWith(...el.childNodes));
  ed.dispatchEvent(new Event('input',{bubbles:true}));
}

function applySize(px){

  }

  document.execCommand('fontSize',false,'7');

/* ================= Enter 규칙 (모든 에디터 공통) =================
   - 제목/인용/박스 안 빈 줄에서 Enter → 일반 문단으로 빠져나옴 (즉, 엔터 두 번이면 해제)
   - 제목 줄 끝에서 Enter → 다음 줄은 바로 일반 문단
   - 빈 불렛에서 Enter → 목록 해제 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  const ed=e.target.closest&&e.target.closest('[contenteditable]'); if(!ed||!document.getElementById('view')?.contains(ed))return;
  const sel=getSelection(); if(!sel.rangeCount||!sel.isCollapsed)return;
  let node=sel.anchorNode; if(node.nodeType===3)node=node.parentNode; if(!ed.contains(node))return;
  const exitTo=(after)=>{ e.preventDefault(); const p=document.createElement('div'); p.innerHTML='<br>'; after.after(p);
    const r=document.createRange(); r.setStart(p,0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); ed.dispatchEvent(new Event('input',{bubbles:true})); };
  const isEmpty=el=>strip(el.innerHTML)==='';
  const r=sel.getRangeAt(0);
  const atEnd=el=>{const t=document.createRange(); t.selectNodeContents(el); t.setStart(r.endContainer,r.endOffset); return strip(t.cloneContents().textContent||'')==='';};
  /* 1) 빈 불렛 */
  const li=node.closest('li');
  if(li&&ed.contains(li)&&isEmpty(li)){ e.preventDefault(); const list=li.closest('ul,ol'); const p=document.createElement('div'); p.innerHTML='<br>';
    if(li.nextElementSibling){ const rest=list.cloneNode(false); while(li.nextSibling)rest.appendChild(li.nextSibling); list.after(rest); }
    list.after(p); li.remove(); if(!list.children.length)list.remove();
    const rr=document.createRange(); rr.setStart(p,0); rr.collapse(true); sel.removeAllRanges(); sel.addRange(rr); ed.dispatchEvent(new Event('input',{bubbles:true})); return; }
  /* 2) 박스 안 빈 줄 → 박스 밖으로 */
  const co=node.closest('.callout');
  if(co&&ed.contains(co)){ const line=node===co?null:node.closest('.callout > *'); if(line&&line!==co.firstElementChild&&isEmpty(line)){ line.remove(); exitTo(co); return; } return; }
  /* 3) 제목/인용 */
  const blk=node.closest('h1,h2,h3,blockquote');
  if(blk&&ed.contains(blk)){ if(isEmpty(blk)){ e.preventDefault(); const p=document.createElement('div'); p.innerHTML='<br>'; blk.replaceWith(p);
      const rr=document.createRange(); rr.setStart(p,0); rr.collapse(true); sel.removeAllRanges(); sel.addRange(rr); ed.dispatchEvent(new Event('input',{bubbles:true})); return; }
    if(blk.tagName!=='BLOCKQUOTE'&&atEnd(blk)){ exitTo(blk); return; } }
});

function curBlock(ed){ if(!ed)return null; const sel=getSelection(); if(!sel.rangeCount)return null; let n=sel.anchorNode; if(n.nodeType===3)n=n.parentNode; if(!ed.contains(n)||n===ed)return null; const b=n.closest('h1,h2,h3,blockquote'); return b&&ed.contains(b)?b:null; }
function withCaretMarker(fn){
  const sel=getSelection(); if(!sel.rangeCount){fn(null);return;}
  const r=sel.getRangeAt(0).cloneRange(); r.collapse(true); const m=document.createElement('span'); m.id='__c'; r.insertNode(m);
  fn(m);
  const mm=document.getElementById('__c'); if(mm){const nr=document.createRange(); nr.setStartAfter(mm); nr.collapse(true); mm.remove(); sel.removeAllRanges(); sel.addRange(nr);}

    withCaretMarker(()=>{const d=document.createElement('div'); d.innerHTML=cur.innerHTML; if(!strip(d.innerHTML)&&!d.querySelector('#__c'))d.innerHTML='<br>'; cur.replaceWith(d);});
    edChanged(); return;
  }
  if(cur){ withCaretMarker(()=>{const n=document.createElement(tag); n.innerHTML=cur.innerHTML; cur.replaceWith(n);}); edChanged(); return; }
