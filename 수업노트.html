  rowBg(col){const c=curCell(); if(!c)return; [...c.parentElement.cells].forEach(x=>{if(col)x.style.background=col; else x.style.removeProperty('background');}); edChanged();}
};
let _tt=null;
function tableTools(){
  if(!_tt){_tt=document.createElement('div'); _tt.className='tbl-tools'; document.body.appendChild(_tt);
    _tt.innerHTML=`<button data-t="rowAbove" title="위에 행">↥ 행</button><button data-t="rowBelow" title="아래에 행">↧ 행</button><button data-t="colLeft" title="왼쪽에 열">↤ 열</button><button data-t="colRight" title="오른쪽에 열">↦ 열</button>
      <span class="tsep"></span><button data-t="delRow" title="행 삭제">행 ✕</button><button data-t="delCol" title="열 삭제">열 ✕</button>
      <span class="tsep"></span><button data-t="headRow" title="첫 행 머리글 켜기/끄기">머리글</button>
      <button data-p="bg" title="셀/행 배경색">셀 색 ▾</button><button data-p="border" title="테두리">테두리 ▾</button>
      <span class="tsep"></span><button data-t="delTable" title="표 삭제" style="color:var(--danger)">표 삭제</button>`;
    _tt.querySelectorAll('button').forEach(b=>{b.onmousedown=e=>e.preventDefault();});
    _tt.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>T[b.dataset.t]());
    _tt.querySelector('[data-p="bg"]').onclick=e=>{const p=showPop(e.currentTarget,`<div class="pop-t">셀 배경</div><div class="sw-grid">${HL_COLORS.concat([["#f5edda","베이지"],["#eae4f6","라벤더"],["#e3eef8","하늘"],["#f1f3f7","연회색"]]).map(([c,n])=>`<button class="swb" data-c="${c}" title="${n}" style="background:${c}"></button>`).join("")}<input type="color" id="cellCustom" value="#f1f3f7"></div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;"><button class="mini" data-row>행 전체에 적용</button><button class="mini" data-none>없애기</button></div>`);
      let last=null; p.querySelectorAll('[data-c]').forEach(b=>{b.onmousedown=ev=>ev.preventDefault(); b.onclick=()=>{last=b.dataset.c; T.cellBg(last);};});
      p.querySelector('#cellCustom').onchange=ev=>{last=ev.target.value; T.cellBg(last);};
      p.querySelector('[data-row]').onclick=()=>{T.rowBg(last||"#f1f3f7");}; p.querySelector('[data-none]').onclick=()=>{T.cellBg(null);closePop();};};
    _tt.querySelector('[data-p="border"]').onclick=e=>{const p=showPop(e.currentTarget,`<div class="pop-t">테두리</div><div style="display:flex;gap:6px;flex-wrap:wrap;"><button class="mini" data-b="">기본</button><button class="mini" data-b="bold">굵게</button><button class="mini" data-b="nb">없음</button><button class="mini" data-b="zebra">줄무늬</button></div>`);
      p.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{T.border(b.dataset.b);closePop();});};
  }
  return _tt;
}
function updateTableTools(){
  const c=curCell(); const tt=tableTools();
  if(!c){tt.classList.remove('show');return;}
  const t=c.closest('table'); const r=t.getBoundingClientRect();
  tt.classList.add('show'); tt.style.left=Math.max(8,r.left)+'px'; tt.style.top=Math.max(8,r.top-38)+'px';
}
document.addEventListener('selectionchange',updateTableTools);
window.addEventListener('scroll',()=>{if(_tt&&_tt.classList.contains('show'))updateTableTools();},true);
/* Tab: 다음 칸 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return; const c=curCell(); if(!c)return; e.preventDefault();
  const t=c.closest('table'); const cells=[...t.querySelectorAll('td,th')]; let i=cells.indexOf(c)+(e.shiftKey?-1:1);
  if(i>=cells.length){T.rowBelow(); const cells2=[...t.querySelectorAll('td,th')]; i=cells.length;} else if(i<0)i=0;
  const tgt=[...t.querySelectorAll('td,th')][i]; if(!tgt)return; const r=document.createRange(); r.selectNodeContents(tgt); r.collapse(false); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
});
/* 열 너비 드래그 */
let _rs=null;
document.addEventListener('mousemove',e=>{
  if(_rs){ const dx=e.clientX-_rs.x; const a=Math.max(40,_rs.wa+dx), b=Math.max(40,_rs.wb-dx); if(a===_rs.wa&&b===_rs.wb)return;
    _rs.rows.forEach(tr=>{if(tr.cells[_rs.i])tr.cells[_rs.i].style.width=a+'px'; if(tr.cells[_rs.j])tr.cells[_rs.j].style.width=b+'px';}); return; }
  const c=e.target.closest&&e.target.closest('table.nt td,table.nt th'); if(!c)return;
  const rect=c.getBoundingClientRect(); c.style.cursor=(rect.right-e.clientX<6&&c.cellIndex<c.parentElement.cells.length-1)||(e.clientX-rect.left<6&&c.cellIndex>0)?'col-resize':'';
});
document.addEventListener('mousedown',e=>{
  const c=e.target.closest&&e.target.closest('table.nt td,table.nt th'); if(!c)return;
  const rect=c.getBoundingClientRect(); let i=null;
  if(rect.right-e.clientX<6&&c.cellIndex<c.parentElement.cells.length-1)i=c.cellIndex; else if(e.clientX-rect.left<6&&c.cellIndex>0)i=c.cellIndex-1;
  if(i===null)return; e.preventDefault();
  const t=c.closest('table'); const rows=[...t.rows]; const ca=rows[0].cells[i],cb=rows[0].cells[i+1];
  _rs={x:e.clientX,i,j:i+1,rows,wa:ca.getBoundingClientRect().width,wb:cb.getBoundingClientRect().width,ed:c.closest('[contenteditable]')};
});
document.addEventListener('mouseup',()=>{if(_rs){const ed=_rs.ed; _rs=null; if(ed)ed.dispatchEvent(new Event('input',{bubbles:true}));}});
/* 체크박스 ☐ 클릭 → ☑ 토글 */
document.addEventListener('click',e=>{
  const ed=e.target.closest&&e.target.closest('[contenteditable]'); if(!ed||!document.getElementById('view')?.contains(ed))return;
  const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null; if(!r||r.startContainer.nodeType!==3)return;
  const tn=r.startContainer, s=tn.textContent; const cand=[r.startOffset,r.startOffset-1];
  for(const o of cand){ if(o<0||o>=s.length)continue; const ch=s[o]; if(ch==='☐'||ch==='☑'){ tn.textContent=s.slice(0,o)+(ch==='☐'?'☑':'☐')+s.slice(o+1); const nr=document.createRange(); nr.setStart(tn,o+1); nr.collapse(true); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(nr); ed.dispatchEvent(new Event('input',{bubbles:true})); return; } }
});


/* Tab = 들여쓰기, Shift+Tab = 내어쓰기 (표 안에서는 칸 이동) */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return; if(curCell())return;
  const ed=e.target.closest&&e.target.closest('[contenteditable]'); if(!ed||!document.getElementById('view')?.contains(ed))return;
  if(ed.matches('.bp-name,.bp-cite,#eTitle,#ePages,.blk-title,.vc,.c-name,[data-j]'))return; /* 짧은 칸은 기본 Tab(다음 칸)*/
  e.preventDefault();
  const sel=getSelection(); let n=sel.anchorNode; if(n&&n.nodeType===3)n=n.parentNode;
  const inList=n&&n.closest&&n.closest('li');
  if(e.shiftKey){ document.execCommand('outdent'); }
  else if(inList){ document.execCommand('indent'); }
  else if(sel.isCollapsed){
    const r=sel.getRangeAt(0); const blk=(n&&n.closest&&n.closest('p,div,h1,h2,h3,li,blockquote'))||ed; const t=document.createRange(); t.selectNodeContents(blk); t.setEnd(r.startContainer,r.startOffset);
    if(strip(t.cloneContents().textContent||'')==='')document.execCommand('indent'); /* 줄 맨 앞 → 문단 들여쓰기 */
    else document.execCommand('insertHTML',false,'&emsp;'); } /* 줄 중간 → 넓은 공백 */
  else { document.execCommand('indent'); }
  ed.dispatchEvent(new Event('input',{bubbles:true}));
});
